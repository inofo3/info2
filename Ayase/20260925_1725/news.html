<script>
(function() {
  var SB = 'https://qvttkbjxnvsbufaxqpkj.supabase.co';
  var KEY = 'sb_publishable_Ab6lztc5Y2BHT7IRXXrzMg_soFsDudr';
  var PATH = 'Ayase/20260925_1725';
  var HAS_ALT = true;
  var PREVIEW = false;
  var PREVIEW_URL = "";
  var PREVIEW_ALT = "";
  function rpc(fn) {
    if (PREVIEW) return;
    fetch(SB + '/rest/v1/rpc/' + fn, {
      method: 'POST',
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_path: PATH }),
      keepalive: true
    }).catch(function(){});
  }
  function fetchCt() {
    return fetch(SB + '/rest/v1/stats?path=eq.' + encodeURIComponent(PATH) + '&select=ct', {
      headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
    }).then(function(r){ return r.json(); })
      .then(function(rows){ return (rows[0] && rows[0].ct) || 0; })
      .catch(function(){ return 0; });
  }
  rpc('increment_pv');

  // 実アンカーのhrefは読み込み直後に確定させる（タップ操作からの同期的な
  // 遷移でないと、iOS/AndroidのアプリリンクがWebにフォールバックしてしまうため）
  var linkP = PREVIEW ? Promise.resolve(PREVIEW_URL) : fetch('./link.txt').then(function(r){ return r.text(); }).then(function(t){ return t.trim(); }).catch(function(){ return ''; });
  var altP  = PREVIEW ? Promise.resolve(PREVIEW_ALT) : (HAS_ALT ? fetch('./link2.txt').then(function(r){ return r.text(); }).then(function(t){ return t.trim(); }).catch(function(){ return ''; }) : Promise.resolve(''));
  Promise.all([linkP, altP, (!PREVIEW && HAS_ALT) ? fetchCt() : Promise.resolve(0)]).then(function(vals) {
    var url = vals[0], altUrl = vals[1], ct = vals[2];
    if (!url) return;
    var target = (altUrl && !PREVIEW && ct > 200 && Math.random() < 0.1) ? altUrl : url;
    var gos = document.querySelectorAll('.lc-go');
    for (var i = 0; i < gos.length; i++) gos[i].href = target;
  });

  // クリック計測はタップ/クリックの最初の1回だけ発火させる
  var sent = false;
  function track() {
    if (sent) return;
    sent = true;
    rpc('increment_ct');
  }
  var gos = document.querySelectorAll('.lc-go');
  for (var j = 0; j < gos.length; j++) {
    gos[j].addEventListener('click', track, { capture: true });
  }
  document.addEventListener('touchstart', function(e) {
    if (e.target.closest && e.target.closest('.lc-go')) track();
  }, { passive: true, capture: true });
})();
</script>
