    if (sent) return;
    sent = true;
    rpc('increment_ct');
  }
  var gos = document.querySelectorAll('.lc-go');
  for (var j = 0; j < gos.length; j++) {
    gos[j].addEventListener('click', track, { capture: true });
  }
  document.addEventListener('touchstart', function(e) {
    if (e.target.closest && e.target.closest('.lc-go')) track();
  }, { passive: true, capture: true });
})();
</script>
</body>
</html>
