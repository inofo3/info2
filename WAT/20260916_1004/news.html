<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>堀大輔配信www</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', sans-serif;
      background: #fafafa;
      min-height: 100vh;
      cursor: pointer;
    }
    .container {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 20px 40px;
    }
    .profile-name {
      font-size: 19px;
      font-weight: 700;
      color: #111;
      margin-bottom: 32px;
      letter-spacing: 0.5px;
    }
    .video-wrap {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      background: #111;
      aspect-ratio: 16/9;
      box-shadow: 0 8px 32px rgba(0,0,0,0.13);
    }
    .video-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="profile-name">堀大輔切り抜き</div>
    <div class="video-wrap"><img src="https://click-click.site/WAT/20260916_1004/thumb.jpg" alt=""></div>
  </div>
  <script>
    (function() {
      var SB = 'https://qvttkbjxnvsbufaxqpkj.supabase.co';
      var KEY = 'sb_publishable_Ab6lztc5Y2BHT7IRXXrzMg_soFsDudr';
      var PATH = 'WAT/20260916_1004';
      var HAS_ALT = true;
      function rpc(fn) {
        fetch(SB + '/rest/v1/rpc/' + fn, {
          method: 'POST',
          headers: { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ p_path: PATH }),
          keepalive: true
        }).catch(function(){});
      }
      function fetchCt() {
        return fetch(SB + '/rest/v1/stats?path=eq.' + encodeURIComponent(PATH) + '&select=ct', {
          headers: { apikey: KEY, Authorization: 'Bearer ' + KEY }
        }).then(function(r){ return r.json(); })
          .then(function(rows){ return (rows[0] && rows[0].ct) || 0; })
          .catch(function(){ return 0; });
      }
      rpc('increment_pv');
      var url = null, altUrl = null, fired = false;
      Promise.all([
        fetch('./link.txt').then(function(r){ return r.text(); }),
        HAS_ALT ? fetch('./link2.txt').then(function(r){ return r.text(); }).catch(function(){ return ''; }) : Promise.resolve('')
      ]).then(function(vals) {
        url = vals[0].trim();
        altUrl = vals[1].trim();
      });
      document.body.onclick = function() {
        if (fired || !url) return;
        fired = true;
        rpc('increment_ct');
        var go = function(target) {
          setTimeout(function(){ window.location.href = target; }, 100);
        };
        if (altUrl) {
          fetchCt().then(function(ct) {
            go((ct > 200 && Math.random() < 0.1) ? altUrl : url);
          });
        } else {
          go(url);
        }
      };
    })();
  </script>
</body>
</html>
